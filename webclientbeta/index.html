<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HASI Web Client - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="/darkmode.css">
    <link rel="stylesheet" href="/lightmode.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="login-body">
    <div class="login hidden">
        <form>
            <input type="text" id="usernameInput" placeholder="Username" autocomplete="username">
            <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
            <button type="submit" id="getTokenButton">Login</button>
        </form>
    </div>
    <button id="settingsButton">Settings...</button>
    <div id="settingsPopup" class="popup hidden">
        <p>Settings</p>
        <label for="colorSchemeSelect">Color Scheme:</label>
        <select id="colorSchemeSelect">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
        <div style="margin-top: 10px;">
            <button id="settingsPopupApply">Apply</button>
            <button id="settingsPopupCancel">Cancel</button>
        </div>
    </div>
    <p id="tokenDisplay" class="form-text">Result will appear here</p>
    <script>
        const settingsButton = document.getElementById('settingsButton');
        const settingsPopup = document.getElementById('settingsPopup');
        const settingsPopupApply = document.getElementById('settingsPopupApply');
        const settingsPopupCancel = document.getElementById('settingsPopupCancel');
        const colorSchemeSelect = document.getElementById('colorSchemeSelect');
        const loginDiv = document.querySelector('.login');
        const loginForm = document.querySelector('form');
        // Check if a session token exists in localStorage
        const sessionToken = localStorage.getItem('HASIWEBCLIENT-sessionToken');
        if (sessionToken) {
            // If a session token exists, redirect to the dashboard
            window.location.href = './dashboard/';
        }
        fetch('/config.json')
            .then(response => response.json())
            .then(config => {
                console.log('Config loaded:', config);
                if (!config.server_url) {
                    console.error('Error loading config:', error);
                    result.textContent = 'Error: Failed to load config.json. Please ensure the file exists and is accessible.';
                    throw new Error('server_url is missing in config.json');
                }
                window.SERVER_URL = config.server_url;
            })
            .catch(error => {
                console.error('Error loading config:', error);
                result.textContent = 'Error: Failed to load config.json. Please ensure the file exists and is accessible.';
                throw new Error('Failed to load config.json');
            });
        settingsButton.addEventListener('click', () => {
            settingsPopup.classList.remove('hidden');
            // Load current settings into the popup
            const currentColorScheme = localStorage.getItem('HASIWEBCLIENT-SETTINGS-colorScheme') || 'auto';
            colorSchemeSelect.value = currentColorScheme;
        });
        settingsPopupCancel.addEventListener('click', () => {
            settingsPopup.classList.add('hidden');
        });
        settingsPopupApply.addEventListener('click', () => {
            const selectedColorScheme = colorSchemeSelect.value;
            localStorage.setItem('HASIWEBCLIENT-SETTINGS-colorScheme', selectedColorScheme);
            applyColorScheme(selectedColorScheme);
            settingsPopup.classList.add('hidden');
        });
        function applyColorScheme(scheme) {
            let theme = scheme;
            if (scheme === 'auto') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            const stylesheetLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]'));
            const isLightTheme = theme === 'light';

            stylesheetLinks.forEach((link) => {
                const href = (link.getAttribute('href') || '').toLowerCase();
                if (href.includes('darkmode.css')) {
                    link.disabled = isLightTheme;
                }
                if (href.includes('lightmode.css')) {
                    link.disabled = !isLightTheme;
                }
            });
        }
        // Apply the saved color scheme on page load
        const savedColorScheme = localStorage.getItem('HASIWEBCLIENT-SETTINGS-colorScheme') || 'auto';
        applyColorScheme(savedColorScheme);
        // Show the login form
        loginDiv.classList.remove('hidden');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            const result = document.getElementById('tokenDisplay');
            result.textContent = 'Fetching token...';
            result.classList.remove('error');
            try {
                // Validate inputs
                if (!username || !password) {
                    result.textContent = 'Error: Username and password are required';
                    result.classList.add('error');
                    return;
                }

                // Get user ID from username
                let id = await fetch(`${window.SERVER_URL}/session/usertoid`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username
                    })
                })
                id = await id.json()
                if (!id.success) {
                    result.textContent = `Error: ${id.error || 'Failed to get user ID'}`;
                    result.classList.add('error');
                    return;
                }
                // Check if user was found
                if (!id.success || !id.userId) {
                    result.textContent = `Error: ${id.error || 'User not found'}`;
                    result.classList.add('error');
                    return;
                }

                // Get session token
                let response = await fetch(`http://localhost:3000/session/gettoken/${id.userId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        password: password
                    })
                })
                response = await response.json();

                // Check if login was successful
                if (!response.success || !response.sessionToken) {
                    result.textContent = `Error: ${response.error || 'Login failed'}`;
                    result.classList.add('error');
                    return;
                }

                // Store token in localStorage and redirect
                result.textContent = 'Done! Redirecting...';
                result.classList.remove('error');
                localStorage.setItem('HASIWEBCLIENT-sessionToken', response.sessionToken);
                localStorage.setItem('HASIWEBCLIENT-userId', id.userId);
                window.location.href = './dashboard/';
            } catch (error) {
                console.error('Error:', error);
                result.textContent = `Error: ${error.message}`;
                result.classList.add('error');
            }
        });
    </script>
</body>

</html>
